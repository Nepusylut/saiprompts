                get: function() {
                  return customFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }

          if (typeof window !== 'undefined') {
            defineFetchProperty(window);
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchProperty(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineFetchProperty(globalThis);
          }
        } catch (e) {
          console.warn('Fetch setter initialization error:', e);
        }
      })();
